name: Bygg apper

# Bygger "FortiGate Setup" for Mac og Windows på GitHub sine maskiner, med selvtest.
# Last ned under Actions → siste kjøring → Artifacts.
# En tag som v1.2 lager i tillegg en Release med begge zip-filene:
#   git tag v1.2 && git push origin v1.2
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt
      - name: Tester
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q
      - name: Bygg appen (build_app.bat) og selvtest
        shell: cmd
        run: build_app.bat
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/FortiGate Setup" -DestinationPath "dist/FortiGate-Setup-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FortiGate-Setup-windows
          path: dist/FortiGate-Setup-windows.zip
          compression-level: 0
          retention-days: 30

  mac:
    runs-on: macos-latest          # Apple Silicon (M1 og nyere)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt
      - name: Tester
        run: |
          python3 -m pip install -q -r requirements.txt pytest
          python3 -m pytest -q
      - name: Bygg appen (build_app.sh) og selvtest
        run: ./build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FortiGate-Setup-mac
          path: dist/FortiGate-Setup-mac.zip
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: FortiGate-Setup-*.zip
          generate_release_notes: true
          body: |
            **Mac:** last ned `FortiGate-Setup-mac.zip`, dobbeltklikk for å pakke ut, og flytt appen til Programmer.
            Første gang: høyreklikk → Åpne. Står det at appen ikke kan åpnes: Systeminnstillinger → Personvern og sikkerhet → «Åpne likevel».

            **Windows:** last ned `FortiGate-Setup-windows.zip`, pakk ut og dobbeltklikk `FortiGate Setup.exe`.
            Første gang: «Windows beskyttet PC-en» → Mer info → Kjør likevel.
