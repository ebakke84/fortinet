name: Windows-app

# Bygger "FortiGate Setup.exe" på en Windows-maskin hos GitHub.
# Last ned under Actions → siste kjøring → Artifacts → FortiGate-Setup-windows.
# En tag som v1.2 lager i tillegg en Release med zip-fila.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # trengs bare for å lage Release fra tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt

      - name: Tester
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q

      - name: Bygg appen (build_app.bat) og selvtest
        shell: cmd
        run: build_app.bat

      - name: Last opp
        uses: actions/upload-artifact@v4
        with:
          name: FortiGate-Setup-windows
          path: dist/FortiGate Setup/
          retention-days: 30

      - name: Zip til Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "dist/FortiGate Setup" -DestinationPath "FortiGate-Setup-windows-${{ github.ref_name }}.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FortiGate-Setup-windows-*.zip
